name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    # Run tests: 8:30AM monday until friday.
    - cron: '30 8 * * 1-5'

env:
  NODE_VERSION: '22'
  TIMEOUT_MINUTES: 30

jobs:
  api_tests:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Create env file
        run: |
          echo "CLINIC_API=${{ secrets.CLINIC_API }}" > .env
          echo "ID_API=${{ secrets.ID_API }}" >> .env
          echo "E2E_CLINIC=${{ secrets.E2E_CLINIC }}" >> .env
          echo "E2E_AP=${{ secrets.E2E_AP }}" >> .env
          echo "TEST_USER_CLINIC=${{ secrets.TEST_USER_CLINIC }}" >> .env
          echo "TEST_USER_AP=${{ secrets.TEST_USER_AP }}" >> .env
          echo "TEST_PASSWORD=${{ secrets.TEST_PASSWORD }}" >> .env
          echo "TEST_USER_PHONE=${{ secrets.TEST_USER_PHONE }}" >> .env

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build optimized Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: playwright-tests:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Prepare test directory
        run: |
          mkdir -p allure-results
          chmod -R 777 allure-results

      - name: Run API tests
        run: yarn docker:api

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results
          retention-days: 20

  e2e_tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Create env file
        run: |
          echo "CLINIC_API=${{ secrets.CLINIC_API }}" > .env
          echo "ID_API=${{ secrets.ID_API }}" >> .env
          echo "E2E_CLINIC=${{ secrets.E2E_CLINIC }}" >> .env
          echo "E2E_AP=${{ secrets.E2E_AP }}" >> .env
          echo "TEST_USER_CLINIC=${{ secrets.TEST_USER_CLINIC }}" >> .env
          echo "TEST_USER_AP=${{ secrets.TEST_USER_AP }}" >> .env
          echo "TEST_PASSWORD=${{ secrets.TEST_PASSWORD }}" >> .env
          echo "TEST_USER_PHONE=${{ secrets.TEST_USER_PHONE }}" >> .env

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build optimized Docker image
        run: yarn docker:build

      - name: Prepare test directory
        run: |
          mkdir -p allure-results
          chmod -R 777 allure-results

      - name: Run E2E tests
        run: yarn docker:e2e

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e
          path: allure-results
          retention-days: 20

  report:
    name: Generate Test Report
    needs: [ api_tests, e2e_tests ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Save test execution metadata
        if: always()
        run: |
          echo '{
            "runId": "${{ github.run_id }}",
            "runNumber": "${{ github.run_number }}",
            "workflow": "${{ github.workflow }}",
            "timestamp": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"
          }' > allure-results/test-metadata.json
          cat allure-results/test-metadata.json

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      - name: Debug report structure
        run: |
          echo "=== DEBUG: Estrutura do relatório ==="
          echo "Conteúdo de allure-history:"
          ls -la allure-history || echo "Diretório não encontrado"
          
          if [ -d "allure-history/widgets" ]; then
            echo "Conteúdo de allure-history/widgets:"
            ls -la allure-history/widgets || echo "Diretório não encontrado"
          fi
          
          if [ -d "allure-history/history" ]; then
            echo "Conteúdo de allure-history/history:"
            ls -la allure-history/history || echo "Diretório não encontrado"
          fi
          
          echo "Verificando arquivo summary.json:"
          find allure-history -name "summary.json" | xargs ls -la || echo "Arquivo não encontrado"
          
          echo "=================================="

      - name: Deploy report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          force_orphan: true